[build]
  command = "npm run build"
  publish = "dist"

# Roteamento por hash (createWebHashHistory) — o servidor só entrega o index.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# O index.html NUNCA pode ser cacheado, senão o navegador serve bundle velho.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
